<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Quicksand:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<title>💖Ahona💖</title></head>
<body data-page="main">
<header class="hero wrap">
  <figure class="polaroid me">
    <img id="profile" src="data/profile_photo.jpg" alt="Ahona">
    <figcaption>my favourite person</figcaption>
  </figure>
  <h1>Happy day, Ahona!</h1>
  <p>Pretty 🎀</p>

<main class="memories" id="memories">
  <div class="wrap">
    <h2>Little memories</h2>
    <p>Tap a photo to open the story 💌</p>
    <div class="grid" id="grid"></div>
  </div>
</main>
<footer>Made with 💖</footer>
<script src="data/data.js"></script>
<script src="script.js"></script>
